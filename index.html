<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tour Bangladesh</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #f5f4ee;
      --accent-green: #0d6342;
      --pill-bg: #e2e8f0;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --gold-accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .app-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
    }

    @media (max-width: 850px) { .app-container { grid-template-columns: 1fr; } }

    /* Left Sidebar */
    .sidebar {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      max-height: 880px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sidebar-title { font-size: 1.1rem; font-weight: 700; }
