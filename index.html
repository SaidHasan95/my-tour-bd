<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tour Bangladesh</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #ffffff;
      --accent-green: #0d6342;
      --pill-bg: #f1f5f9;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --gold-accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 15px;
      max-width: 1200px;
      width: 100%;
    }

    @media (max-width: 900px) { 
      .app-container { grid-template-columns: 1fr; } 
    }

    /* Left Sidebar */
    .sidebar {
      background: #ffffff;
      border-radius: 16px;
      padding: 15px;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sidebar-title { font-size: 1.05rem; font-weight: 700; }
    .count-badge { background: #e2e8f0; color: #475569; padding: 2px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; }

    .search-box {
      width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1;
      border-radius: 10px; outline: none; font-size: 0.9rem; margin-bottom: 12px; background: #f8fafc;
    }

    .home-district-select {
      width: 100%; padding: 8px 10px; border: 1px dashed var(--gold-accent);
      border-radius: 8px; outline: none; font-size: 0.85rem; margin-bottom: 12px; background: #fffbe0;
      color: #78350f; font-weight: 600; cursor: pointer;
    }

    .divisions-scroll { overflow-y: auto; padding-right: 5px; flex: 1; max-height: 450px; }
    @media (min-width: 901px) { .divisions-scroll { max-height: 680px; } }

    .division-block { margin-bottom: 14px; }
    .division-header { 
      font-size: 0.85rem; font-weight: 700; color: var(--text-muted); 
      margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px;
      display: flex; justify-content: space-between;
    }
    .district-pills { display: flex; flex-wrap: wrap; gap: 6px; }

    .pill-btn {
      background: var(--pill-bg); color: var(--text-dark); border: 1px solid #e2e8f0;
      padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: 0.2s;
    }
    .pill-btn.selected { background: var(--accent-green); color: #ffffff; border-color: var(--accent-green); font-weight: 600; }

    /* Controls Bar */
    .controls-card {
      background: #ffffff; border-radius: 16px; padding: 12px 15px; margin-bottom: 12px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .theme-selector { display: flex; align-items: center; gap: 8px; }
    .theme-dot {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid #fff;
      box-shadow: 0 0 0 1px #cbd5e1; transition: transform 0.2s;
    }
    .theme-dot:hover { transform: scale(1.15); }

    .user-inputs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .custom-file-btn, .name-input {
      padding: 7px 12px; border-radius: 10px; font-size: 0.82rem; border: 1px solid #cbd5e1; outline: none;
    }
    .custom-file-btn { background: #f1f5f9; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 600;}
    .name-input { background: #f8fafc; font-weight: 600; color: #0f172a; width: 140px; }

    /* Map Section Area */
    .map-section {
      background: #fdfbf7; border-radius: 16px; padding: 22px;
      display: flex; flex-direction: column; position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .map-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
    .map-title-sub { font-size: 0.72rem; color: #78716c; letter-spacing: 0.5px; font-weight: 600; }
    .map-title-main { font-size: 1.6rem; font-weight: 800; color: #1c1917; display: flex; align-items: center; gap: 8px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: none; border: 2px solid var(--accent-green); }

    .stats-score { font-size: 2.2rem; font-weight: 800; color: var(--accent-green); text-align: right; }
    .stats-score span { font-size: 1.1rem; color: #78716c; font-weight: 500; }

    /* Real Professional Geographic SVG Map Container */
    .svg-map-container {
      width: 100%; margin: 15px 0; border-radius: 12px; background: #fdfbf7;
      padding: 5px; display: flex; justify-content: center; align-items: center;
    }
    
    .map-shape-svg {
      width: 100%; max-width: 480px; height: auto;
    }
    
    .map-district-shape {
      fill: #e7e2d7;
      stroke: #fdfbf7;
      stroke-width: 0.8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .map-district-shape:hover {
      fill: #d6d0c4;
      stroke: var(--accent-green);
      stroke-width: 1.2px;
    }
    .map-district-shape.selected {
      fill: var(--accent-green);
      stroke: #fdfbf7;
      stroke-width: 1.2px;
    }
    .map-district-shape.home-selected {
      fill: #f59e0b;
      stroke: #78350f;
      stroke-width: 1.5px;
    }

    .progress-section { margin-top: 5px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #e7e2d7; border-radius: 10px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar-fill { height: 100%; background: var(--accent-green); width: 0%; transition: width 0.4s ease; }
    
    .progress-info { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 700; color: #1c1917; }

    .brand-footer {
      border-top: 1px solid #e7e2d7; margin-top: 14px; padding-top: 10px;
      display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; color: #1c1917; flex-wrap: wrap; gap: 8px;
    }
    .footer-left { display: flex; align-items: center; gap: 6px; }
    .brand-logo-icon { width: 16px; height: 16px; background: var(--accent-green); border-radius: 4px; display: inline-block; }

    .download-card { background: #ffffff; border-radius: 16px; padding: 15px; margin-top: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .download-card h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: #0f172a; }
    .download-buttons-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    
    .btn-dl-box {
      background: #ffffff; border: 1px solid #cbd5e1; padding: 8px; border-radius: 8px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center; color: #0f172a; transition: all 0.2s;
    }
    .btn-dl-box.primary { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .btn-dl-box:hover { opacity: 0.9; transform: translateY(-2px); }
  </style>
</head>

    const divBnNames = {
      "Rangpur": "রংপুর বিভাগ", "Rajshahi": "রাজশাহী বিভাগ", "Mymensingh": "ময়মনসিংহ বিভাগ",
      "Sylhet": "সিলেট বিভাগ", "Dhaka": "ঢাকা বিভাগ", "Khulna": "খুলনা বিভাগ",
      "Barisal": "বরিশাল বিভাগ", "Chittagong": "চট্টগ্রাম বিভাগ"
    };

    function toBanglaNum(num) {
      const bnNums = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return num.toString().replace(/\d/g, d => bnNums[d]);
    }

    let selectedDistricts = new Set();
    let homeDistrict = "";

    function initApp() {
      buildSidebar();
      populateHomeDistrictDropdown();
      updateUI();
    }

    function populateHomeDistrictDropdown() {
      const select = document.getElementById('home-district-select');
      Object.keys(bnNames).sort().forEach(dist => {
        const opt = document.createElement('option');
        opt.value = dist;
        opt.innerText = `🏠 ${bnNames[dist]}`;
        select.appendChild(opt);
      });
    }

    function setHomeDistrict(distName) {
      homeDistrict = distName;
      if (distName) selectedDistricts.add(distName);
      updateUI();
    }

    function buildSidebar() {
      const divisionsListEl = document.getElementById('divisions-list');
      divisionsListEl.innerHTML = '';

      Object.keys(divisionsMap).forEach(divKey => {
        const divBlock = document.createElement('div');
        divBlock.className = 'division-block';

        const divHeader = document.createElement('div');
        divHeader.className = 'division-header';
        divHeader.innerHTML = `<span>${divBnNames[divKey]}</span><span id="div-badge-${divKey}" style="font-size:0.75rem; color:#0d6342;">০/${divisionsMap[divKey].length}</span>`;

        const pillsContainer = document.createElement('div');
        pillsContainer.className = 'district-pills';

        divisionsMap[divKey].forEach(distName => {
          const pill = document.createElement('button');
          pill.className = 'pill-btn';
          const cleanId = distName.replace(/['\s]+/g, '');
          pill.setAttribute('id', `pill-${cleanId}`);
          pill.innerText = bnNames[distName] || distName;
          pill.onclick = () => toggleDistrict(distName);
          pillsContainer.appendChild(pill);
        });

        divBlock.appendChild(divHeader);
        divBlock.appendChild(pillsContainer);
        divisionsListEl.appendChild(divBlock);
      });
    }

    function toggleDistrict(distName) {
      if (selectedDistricts.has(distName)) {
        if(distName === homeDistrict) homeDistrict = "";
        selectedDistricts.delete(distName);
      } else {
        selectedDistricts.add(distName);
      }
      updateUI();
    }

    function updateUI() {
      Object.keys(divisionsMap).forEach(divKey => {
        let divCount = 0;
        divisionsMap[divKey].forEach(d => {
          if (selectedDistricts.has(d)) divCount++;
        });
        const badge = document.getElementById(`div-badge-${divKey}`);
        if(badge) badge.innerText = `${toBanglaNum(divCount)}/${toBanglaNum(divisionsMap[divKey].length)}`;
      });

      Object.keys(bnNames).forEach(distName => {
        const cleanId = distName.replace(/['\s]+/g, '');
        const pill = document.getElementById(`pill-${cleanId}`);
        const shape = document.getElementById(`shape-${cleanId}`);
        const isSelected = selectedDistricts.has(distName);
        const isHome = (distName === homeDistrict);

        if (pill) {
          if (isSelected) pill.classList.add('selected');
          else pill.classList.remove('selected');
        }

        if (shape) {
          shape.className.baseVal = "map-district-shape";
          if (isHome) {
            shape.classList.add('home-selected');
          } else if (isSelected) {
            shape.classList.add('selected');
          }
        }
      });

      const count = selectedDistricts.size;
      const percentage = Math.round((count / 64) * 100);

      const activeDivisions = new Set();
      Object.keys(divisionsMap).forEach(div => {
        divisionsMap[div].forEach(d => {
          if (selectedDistricts.has(d)) activeDivisions.add(div);
        });
      });

      document.getElementById('count-badge').innerText = `${toBanglaNum(count)}/৬৪`;
      document.getElementById('stats-score').innerHTML = `${toBanglaNum(count)}<span>/৬৪</span>`;
      document.getElementById('progress-fill').style.width = `${percentage}%`;
      document.getElementById('percentage-text').innerText = `${toBanglaNum(percentage)}% বাংলাদেশ ঘোরা হয়েছে`;
      document.getElementById('div-stats-text').innerText = `${toBanglaNum(count)}টি জেলা · ৮টির মধ্যে ${toBanglaNum(activeDivisions.size)}টি বিভাগ`;
    }

    function setTheme(accentColor, cardBgColor) {
      document.documentElement.style.setProperty('--accent-green', accentColor);
      document.documentElement.style.setProperty('--card-bg', cardBgColor);
      document.getElementById('export-card').style.backgroundColor = cardBgColor;
      updateUI();
    }

    function updateName() {
      const val = document.getElementById('user-name-input').value.trim();
      document.getElementById('display-name').innerText = val ? `${val}-এর বাংলাদেশ` : 'আমার বাংলাদেশ';
    }

    function loadAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        const imgEl = document.getElementById('display-avatar');
        imgEl.src = URL.createObjectURL(file);
        imgEl.style.display = 'inline-block';
      }
    }

    function downloadMap(format) {
      const card = document.getElementById('export-card');

      html2canvas(card, { useCORS: true, scale: 3 }).then(canvas => {
        if (format === 'png') {
          const link = document.createElement('a');
          link.download = 'My-Tour-Bangladesh.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else if (format === 'jpg') {
          const link = document.createElement('a');
          link.download = 'My-Tour-Bangladesh.jpg';
          link.href = canvas.toDataURL('image/jpeg', 0.95);
          link.click();
        } else if (format === 'pdf') {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const imgData = canvas.toDataURL('image/png');
          const imgWidth = 190;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
          pdf.save('My-Tour-Bangladesh.pdf');
        }
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.style.display = btn.innerText.toLowerCase().includes(q) ? 'inline-block' : 'none';
      });
    });

    window.onload = initApp;
  </script>
